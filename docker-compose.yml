services:

  mysql:
    image: mysql:8
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: demo_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    image: dockerdemoapp
    build:
      context: .
      dockerfile: dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "9090:9090"
    environment:
      SERVER_PORT: 9090
      DB_HOST: mysql
      APP_FILE_PATH: /app/names.txt
    volumes:
      - names-volume:/app

volumes:
  names-volume:
  mysql-data:

